<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepLearn AI - Authentication</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --text: #1f2937;
      --text-light: #6b7280;
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --border-radius: 12px;
      --box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      --transition: all 0.3s ease;
    }
    .dark-mode {
      --text: #f9fafb;
      --text-light: #d1d5db;
      --bg: #111827;
      --card-bg: #1f2937;
    }
    body {
      background: var(--bg);
      color: var(--text);
      transition: var(--transition);
      min-height: 100vh;
    }
    .ai-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    .ai-particle {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--primary), var(--primary-light));
      opacity: 0.15;
      filter: blur(20px);
      animation: float 15s infinite ease-in-out;
    }
    .ai-particle:nth-child(1){width:300px;height:300px;top:20%;left:10%;animation-delay:0s;}
    .ai-particle:nth-child(2){width:400px;height:400px;top:60%;left:25%;animation-delay:2s;}
    .ai-particle:nth-child(3){width:250px;height:250px;top:30%;left:75%;animation-delay:4s;}
    .ai-particle:nth-child(4){width:350px;height:350px;top:70%;left:65%;animation-delay:6s;}
    .ai-particle:nth-child(5){width:200px;height:200px;top:10%;left:50%;animation-delay:8s;}
    @keyframes float {
      0%,100%{transform:translate(0,0);}
      25%{transform:translate(-20px,-40px);}
      50%{transform:translate(30px,20px);}
      75%{transform:translate(-10px,30px);}
    }
    .ai-connections {position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}
    .connection {position:absolute;background:linear-gradient(to right,var(--primary),var(--primary-light));height:1px;opacity:0.1;}
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
      z-index: 1;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 0;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .theme-toggle {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text);
    }
    .auth-container {
      max-width: 480px;
      margin: 30px auto 80px;
      padding: 40px;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      border: 1px solid rgba(0,0,0,0.05);
    }
    .auth-tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }
    .auth-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-light);
    }
    .auth-tab.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }
    .auth-form {display:none;}
    .auth-form.active {display:block;}
    .form-group {margin-bottom: 20px; position:relative;}
    .form-group label {display:block;margin-bottom:6px;font-size:14px;}
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 8px;
      background: var(--bg);
    }
    .input-icon {
      position: absolute;
      right: 16px;
      top: 40px;
      color: var(--text-light);
    }
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 40px;
      cursor: pointer;
      color: var(--text-light);
    }
    .auth-button {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-button:hover {background: var(--primary-dark);}
    .auth-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--text-light);
    }
    .auth-footer a {color: var(--primary); text-decoration:none;}
    .auth-footer a:hover {text-decoration: underline;}
  </style>
</head>
<body>
  <!-- Background -->
  <div class="ai-bg">
    <div class="ai-particle"></div>
    <div class="ai-particle"></div>
    <div class="ai-particle"></div>
    <div class="ai-particle"></div>
    <div class="ai-particle"></div>
  </div>
  <div class="ai-connections" id="connectionsContainer"></div>

  <div class="container">
    <header>
      <div class="logo">
        <i class="fas fa-brain"></i>
        <span>DeepLearn<span style="font-weight: 700; color: var(--primary-dark)">AI</span></span>
      </div>
      <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
    </header>
    
    <div class="auth-container">
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Sign In</div>
        <div class="auth-tab" data-tab="signup">Create Account</div>
      </div>
      
      <!-- Sign In -->
      <form id="loginForm" class="auth-form active">
        <div class="form-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" required placeholder="Enter your email">
          <i class="fas fa-envelope input-icon"></i>
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="Enter your password">
          <i class="fas fa-lock input-icon"></i>
          <span class="password-toggle" id="loginPasswordToggle"><i class="far fa-eye"></i></span>
        </div>
        <button type="submit" class="auth-button"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        <div class="auth-footer"><a href="#" id="forgotPasswordLink">Forgot password?</a></div>
      </form>
      
      <!-- Sign Up -->
      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input type="text" id="signupName" required placeholder="Enter your full name">
          <i class="fas fa-user input-icon"></i>
        </div>
        <div class="form-group">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail" required placeholder="Enter your email">
          <i class="fas fa-envelope input-icon"></i>
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" required placeholder="Create a password">
          <i class="fas fa-lock input-icon"></i>
          <span class="password-toggle" id="signupPasswordToggle"><i class="far fa-eye"></i></span>
        </div>
        <div class="form-group">
          <label for="signupConfirmPassword">Confirm Password</label>
          <input type="password" id="signupConfirmPassword" required placeholder="Confirm your password">
          <i class="fas fa-lock input-icon"></i>
          <span class="password-toggle" id="signupConfirmPasswordToggle"><i class="far fa-eye"></i></span>
        </div>
        <button type="submit" class="auth-button"><i class="fas fa-user-plus"></i> Create Account</button>
        <div class="auth-footer">Already have an account? <a href="#" id="switchToLogin">Sign in</a></div>
      </form>
    </div>
  </div>

<script>
  // Tab switching
  const tabs = document.querySelectorAll('.auth-tab');
  const forms = document.querySelectorAll('.auth-form');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      forms.forEach(f => f.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(`${tab.dataset.tab}Form`).classList.add('active');
    });
  });

  // Switch to login link
  document.getElementById('switchToLogin')?.addEventListener('click', e => {
    e.preventDefault();
    tabs[0].classList.add('active');
    forms[0].classList.add('active');
    tabs[1].classList.remove('active');
    forms[1].classList.remove('active');
  });

  // Dark mode toggle
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    const icon = themeToggle.querySelector('i');
    icon.classList.toggle('fa-moon');
    icon.classList.toggle('fa-sun');
  });

  // Password toggle
  function setupPasswordToggle(inputId, toggleId) {
    const input = document.getElementById(inputId);
    const toggle = document.getElementById(toggleId);
    if (input && toggle) {
      toggle.addEventListener('click', () => {
        const icon = toggle.querySelector('i');
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('fa-eye','fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('fa-eye-slash','fa-eye');
        }
      });
    }
  }
  setupPasswordToggle('loginPassword','loginPasswordToggle');
  setupPasswordToggle('signupPassword','signupPasswordToggle');
  setupPasswordToggle('signupConfirmPassword','signupConfirmPasswordToggle');

  // Connections (background lines)
  function createConnections() {
    const container = document.getElementById('connectionsContainer');
    container.innerHTML = '';
    const particles = document.querySelectorAll('.ai-particle');
    const pos = [];
    particles.forEach(p => {
      const rect = p.getBoundingClientRect();
      pos.push({x:rect.left+rect.width/2,y:rect.top+rect.height/2});
    });
    for (let i=0;i<pos.length;i++){
      for (let j=i+1;j<pos.length;j++){
        const dx=pos[j].x-pos[i].x,dy=pos[j].y-pos[i].y;
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<500){
          const conn=document.createElement('div');
          conn.className='connection';
          conn.style.width=`${dist}px`;
          conn.style.left=`${pos[i].x}px`;
          conn.style.top=`${pos[i].y}px`;
          conn.style.transform=`rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;
          container.appendChild(conn);
        }
      }
    }
  }
  window.addEventListener('load',createConnections);
  window.addEventListener('resize',createConnections);

  // ✅ Success + Redirect
  document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    alert("✅ Login successful! Redirecting...");
    setTimeout(() => {
      window.location.href = "auth.html"; // your dashboard page
    }, 1000);
  });

  document.getElementById("signupForm").addEventListener("submit", function(e){
    e.preventDefault();
    alert("🎉 Account created successfully! Redirecting...");
    setTimeout(() => {
      window.location.href = "auth.html"; // your dashboard page
    }, 1000);
  });
</script>

</body>
</html>
